name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # No model is configured, so the agent tests use the simulated model.
      - run: pnpm test
      # The reference conversations with the simulated model: a broken rule, tool or scenario
      # fails here. Real-model runs are manual (docs/evals).
      - run: pnpm eval
      - run: pnpm build
